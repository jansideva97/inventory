<div class="app-container">
  <header>
    <h1>Inventory Manager</h1>
    
    <div class="pdf-row">
      <button class="pdf-btn" (click)="downloadPDF('filtered')">PDF ({{selectedBrand()}})</button>
      <button class="pdf-btn dark" (click)="downloadPDF('all')">PDF (All Data)</button>
    </div>

    <div class="brand-manager">
      <input [(ngModel)]="newBrandName" placeholder="New Brand Name">
      <button (click)="addBrand()">+ Brand</button>
    </div>

    <div class="category-selector">
      <div class="selector-header">
        <label>Category</label>
        <button class="del-brand" (click)="deleteBrand()">Delete Brand</button>
      </div>
      <select [(ngModel)]="selectedBrand" (change)="onBrandChange()">
        @for (b of brands(); track b) {
          <option [value]="b">{{b}}</option>
        }
      </select>
    </div>
  </header>

  <section class="add-form">
    <input [(ngModel)]="newProduct.name" placeholder="Product Name">
    <div class="form-row">
      <input [(ngModel)]="newProduct.packSize" placeholder="Pack Size">
      <input [(ngModel)]="newProduct.caseSize" placeholder="Case Size">
    </div>
    <button class="add-btn" (click)="add()">Add New Product</button>
  </section>

  <div class="product-list">
    @for (p of filteredList(); track p.id) {
      <div class="card">
        <div class="card-header">
          <strong>{{p.name}}</strong>
          <span class="badge">{{p.packSize}} | {{p.caseSize}}</span>
        </div>
        <div class="card-body">
          <div class="stock-group">
            <small>Stock</small>
            <input type="number" [(ngModel)]="p.currentStock">
          </div>
          <div class="stock-group">
            <small>Order</small>
            <input type="number" [(ngModel)]="p.orderQty">
          </div>
          <div class="card-actions">
            <button class="btn-save" (click)="update(p)">Save</button>
            <button class="btn-del" (click)="remove(p.id)">&times;</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
